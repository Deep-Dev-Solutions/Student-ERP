# Local services for the API. Ports avoid the host's own Postgres (5432) and Redis (6379).
# File storage (Google Cloud Storage through its S3 API) arrives in Phase 1 with student documents.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepdev
      POSTGRES_PASSWORD: deepdev
      POSTGRES_DB: deepdev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepdev"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
volumes:
  pgdata:
